# ===========================
# Docker Compose für Hetzner Production
# ===========================
version: '3.8'

services:
  kaufe-es-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kaufe-es-agent
    restart: unless-stopped
    
    # Load production ENV
    env_file:
      - .env.production
    
    ports:
      - "3000:3000"  # Backend + Frontend
    
    # Persistent data (Logs, Cache)
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    
    # Resource Limits (Hetzner CPX11 hat 2 vCPU, 2GB RAM)
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Health Check
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Network
    networks:
      - kaufe-es-network

networks:
  kaufe-es-network:
    driver: bridge
