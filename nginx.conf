# Nginx-Konfiguration für Subdomain mit SSL und Proxy auf Backend

server {
    listen 80;
    server_name ki.deinedomain.de;

    location / {
        proxy_pass http://woo-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ki.deinedomain.de;

    ssl_certificate /etc/letsencrypt/live/ki.deinedomain.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ki.deinedomain.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://woo-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
