server {
    listen 80;
    server_name my-working-space.de www.my-working-space.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name my-working-space.de www.my-working-space.de;

    ssl_certificate /etc/letsencrypt/live/my-working-space.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/my-working-space.de/privkey.pem;

    # Frontend static files (vom Backend serviert)
    location / {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API (falls separat benötigt)
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}