version: '3.8'

services:
  nginx:
    version: '3.8'

    services:
      woo-nginx:
        image: nginx:latest
        container_name: woo-nginx
        ports:
          - "80:80"
          - "443:443"
        volumes:
          - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
          - /etc/letsencrypt:/etc/letsencrypt:ro
        depends_on:
          - woo-backend
        networks:
          - kaufe-es-network

      woo-backend:
        build:
          context: .
          dockerfile: Dockerfile
        container_name: woo-backend
        restart: unless-stopped
        expose:
          - "3000"
        environment:
          - NODE_ENV=production
        volumes:
          - ./backend/data:/app/data:rw
          - ./logs:/app/logs:rw
          - ./backend/.env.production:/app/.env:ro
        networks:
          - kaufe-es-network

      watchtower:
        image: containrrr/watchtower
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
        command: --interval 300 --cleanup
        restart: unless-stopped
        networks:
          - kaufe-es-network

    networks:
      kaufe-es-network:
        driver: bridge
    image: nginx:latest
    container_name: woo-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
