services:
  # Backend Service (Node.js API)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: woo-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
    volumes:
      - backend_data:/app/data:rw
      - connection_json:/app/connection.json:rw
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service (nginx mit statischen Files)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: woo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

  # Watchtower für Auto-Updates
  watchtower:
    image: containrrr/watchtower
    container_name: ki-watchtower-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup
    restart: unless-stopped
    networks:
      - app-network

volumes:
  backend_data:
  connection_json:

networks:
  app-network:
    driver: bridge