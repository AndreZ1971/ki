# ===========================
# Docker Compose für Hetzner Production
# ===========================
version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: kaufe-es-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - kaufe-es-agent
    networks:
      - kaufe-es-network

  kaufe-es-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kaufe-es-agent
    restart: unless-stopped
    
    # Load production ENV
    env_file:
      - .env.production
    
    # KEINE ports mehr nach außen - nur intern für Nginx
    expose:
      - "3000"
    
    # Persistent data (Logs, Cache)
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    
    # Resource Limits (Hetzner CPX11 hat 2 vCPU, 2GB RAM)
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Health Check
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Network
    networks:
      - kaufe-es-network

networks:
  kaufe-es-network:
    driver: bridge