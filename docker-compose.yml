version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: kaufe-es-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./frontend-dist:/usr/share/nginx/html:ro  # Falls Frontend vorhanden
    networks:
      - kaufe-es-network

  kaufe-es-agent:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: kaufe-es-agent
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
    env_file:
      - .env.production
    volumes:
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - kaufe-es-network

networks:
  kaufe-es-network:
    driver: bridge