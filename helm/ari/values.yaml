replicaCount: 1

image:
  repository: ki-app
  tag: "latest"
  pullPolicy: IfNotPresent
  # registrySecrets: [] # optional, e.g. [{ name: my-regcred }]

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ari.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

nodeSelector: {}

affinity: {}

tolerations: []
